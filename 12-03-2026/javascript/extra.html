<html>
    <head>
        <title>Extra Assigment</title>
    </head>
    
<!-- hint Math class and String methods 
1) accept length from user and generate random password on javascript and display  -->
    <body>
       <label for="password">Enter the length for password: </label>
       <input type="text" id="password" />
       <button type="button" onclick="genrate()">Generate</button>
       <h4>Generated Password is : </h4>
       <p id="show"></p>
    </body>
        <script type="text/javascript">
     
    function genrate(){
     var password = document.getElementById("password").value;
     var passwordString = "anvaodacnacmkcmacacnaa@1@#E#@@23";
     let new_password = "";

     for(var i = 0 ; i < password ; i++){
       new_password += passwordString[Math.floor(Math.random()*12)];
     } 
        document.getElementById("show").innerText = new_password;
    }

        </script>
    </body>
</html>
